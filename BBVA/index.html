<!DOCTYPE html>
<html>
<head>
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Tarjeta BBVA </title>
    <style>
      
        body 
      
      
      
      {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Calibri', Arial, sans-serif;
            background-color: var(--background-color);
        }


        
        /* Logo BBVA */
        .bbva-logo-container {
            position: absolute;
            bottom: 2%;
            right: 2%;
            z-index: 10;
            transition: all 3s ease;
        }

        .bbva-logo-img {
            width: 30vw;
            max-width: 150px;
            height: auto;
        
        }
        
        .card-type {
            position: absolute;
            top: 3%;
            left: 3%;
            z-index: 10;
            background-color: rgba(240, 240, 240, 0.9);
            color: #004481;
            padding: 1% 2%;
            border-radius: 5px;
            font-size: 2vw;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-left: 4px solid #004481;
            transition: all 1s ease;
        }
      
      /* Texto "intrucciones" abajo a la izquierda */
.inst {
    position: absolute;
    left: 3%;
    bottom: 10%;
    z-index: 10;
    width: 44px;
    height: 44px;
    padding: 0;
    background: rgba(240, 240, 240, 0.9);
    border: 2px solid #004481;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
}

.inst:hover {
    background: rgba(240, 240, 240, 1);
    transform: scale(1.1);
    box-shadow: 0 4px 15px rgba(0,68,129,0.2);
}

.inst:active {
    transform: scale(0.95);
}

.inst svg {
    width: 60%;
    height: 60%;
}

@media (max-width: 768px) {
    .inst {
        width: 40px;
        height: 40px;
        bottom: 5%;
    }
}

@media (max-width: 480px) {
    .inst {
        width: 36px;
        height: 36px;
        bottom: 3%;
    }
}
      
        
        /* Estilos para el hotspot mejorado */
        .Hotspot {
            background: rgba(0, 68, 129, 0.7);
            border-radius: 50%;
            border: 2px solid white;
            width: 44px;
            height: 44px;
            padding: 0;
            margin: 0;
            cursor: url ("https://cdn.glitch.global/04de299b-a988-40d9-b6b9-116761f8e341/cursor.png?v=1743606798122"),pointer;
            transition: all 2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
      
        
        .Hotspot:hover {
            background: rgba(0, 68, 129, 0.9);
            transform: scale(1.1);
        }
        
        .HotspotAnnotation {
            display: none;
            position: absolute;
            left: 100%;
            white-space: nowrap;
            margin-left: 12px;
            background: rgba(0, 68, 129, 0.95);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 16px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .Hotspot:hover .HotspotAnnotation {
            display: block;
        }
        


        /* Panel derecho mejorado para los mensajes */
        .info-panel {
            display: none;
            position: fixed;
            top: 50%;
            right: 40px;
            transform: translateY(-50%);
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            z-index: 100;
            width: 320px;
            max-width: 80%;
            border-top: 6px solid #004481;
            animation: slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes slideInRight {
            from { transform: translate(120%, -50%); opacity: 0; }
            to { transform: translate(0, -50%); opacity: 1; }
        }
        
        .info-panel p {
            font-size: 17px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .info-panel button {
            background-color: #004481;
            color: white;
            border: none;
            padding: 30px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 30px;
            width: 100%;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .info-panel button:hover {
            background-color: #003366;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        
      
        @media (max-width: 2100px) {
            .model-container {
                width: 100%;
                height: auto;
                aspect-ratio: 2048/1080;
            }
            
            
            .Hotspot {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }
            
            
            .info-panel {
                right: 400px;
                width: 350px;
                padding: 40px;
            }
            
            .info-panel p {
                font-size: 30px;
            }
        }
        
        @media (max-width: 768px) {
            .bbva-logo-img {
                width: 100px;
            }
             }
            

            .Hotspot {
                width: 32px;
                height: 32px;
                font-size: 50px;
            }
            
            
        .info-panel {
            display: none;
            position: fixed;
            top: 50%;
            right: 2%;
            transform: translateY(-50%);
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            z-index: 100;
            width: 300px;
            max-width: 90%;
            border-top: 6px solid #004481;
            animation: slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .info-panel p {
            font-size: 14px;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .info-panel button {
            background-color: #004481;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: all 1s ease;
            font-weight: bold;
        }

          
    </style>
</head>

          <!-- Hotspot VISA - Versión que mantiene proporciones -->

        // Función para animar la cámara
        function animateCamera(modelViewer, targetOrbit, duration) {
            const startOrbit = modelViewer.cameraOrbit;
            const startTime = performance.now();
            
            function updateCamera() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Interpolación entre los valores iniciales y finales
                const currentOrbit = interpolateOrbits(startOrbit, targetOrbit, progress);
                modelViewer.cameraOrbit = currentOrbit;
                
                if (progress < 1) {
                    requestAnimationFrame(updateCamera);
                }
            }
            
            requestAnimationFrame(updateCamera);
        }
        
        // Función para interpolación de órbitas
        function interpolateOrbits(startOrbit, targetOrbit, progress) {
            const startParts = startOrbit.split(' ');
            const targetParts = targetOrbit.split(' ');
            
            const thetaStart = parseFloat(startParts[0]);
            const phiStart = parseFloat(startParts[1]);
            const radiusStart = parseFloat(startParts[2]);
            
            const thetaTarget = parseFloat(targetParts[0]);
            const phiTarget = parseFloat(targetParts[1]);
            const radiusTarget = parseFloat(targetParts[2]);
            
            // Interpolación lineal para cada componente
            const theta = thetaStart + (thetaTarget - thetaStart) * progress;
            const phi = phiStart + (phiTarget - phiStart) * progress;
            const radius = radiusStart + (radiusTarget - radiusStart) * progress;
            
            return `${theta}deg ${phi}deg ${radius}%`;
        
        
        }
      
              // Modificar la función animateCamera para mantener el logo oculto durante el zoom
function animateCamera(modelViewer, targetOrbit, duration) {
    const startOrbit = modelViewer.cameraOrbit;
    const startTime = performance.now();
    // Ocultar el logotipo al iniciar el zoom
    document.querySelector('.bbva-logo-container').style.opacity = '0';
    function updateCamera() {
        const elapsed = performance.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const currentOrbit = interpolateOrbits(startOrbit, targetOrbit, progress);
        modelViewer.cameraOrbit = currentOrbit;
        if (progress < 1) {
            requestAnimationFrame(updateCamera);
        }
    }
    requestAnimationFrame(updateCamera);
}
