<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR EXPERIENCE | Realidad Aumentada</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">

</head>
<body>
    <div class="ar-portal">
        <div class="ar-background">
            <div class="ar-grid"></div>
            <div class="ar-elements">
                <div class="ar-element" style="width: 180px; height: 180px; top: 15%; left: 10%; animation-delay: 0s; animation-duration: 22s;"></div>
                <div class="ar-element" style="width: 220px; height: 220px; bottom: 20%; right: 15%; animation-delay: 3s; animation-duration: 25s;"></div>
                <div class="ar-element" style="width: 150px; height: 150px; top: 25%; right: 10%; animation-delay: 6s; animation-duration: 20s;"></div>
                <div class="ar-element" style="width: 120px; height: 120px; bottom: 15%; left: 10%; animation-delay: 9s; animation-duration: 18s;"></div>
                <div class="ar-connection" style="top: 25%; left: 15%; width: 120px; transform: rotate(30deg); animation-delay: 1s;"></div>
                <div class="ar-connection" style="bottom: 20%; right: 15%; width: 180px; transform: rotate(-15deg); animation-delay: 2s;"></div>
                <div class="ar-connection" style="top: 35%; right: 20%; width: 150px; transform: rotate(45deg); animation-delay: 3s;"></div>
            </div>
        </div>
        <header>
            <div class="logo">
                <div class="logo-container">
                    <div class="logo-glow"></div>
                    <div class="logo-icon">
                        <img src="assets/Sin título-1.png" alt="Logotipo AR">
                    </div>
                </div>
                <div class="logo-text">AR EXPERIENCE</div>
            </div>
        </header>
        <main class="main-content">
            <h1>Explora el Futuro con Realidad Aumentada</h1>
            <p class="subtitle">Interactúa con modelos 3D en tu entorno físico. Una experiencia inmersiva que fusiona lo digital con lo real.</p>
            <a href="app.html" class="ar-button">
                Iniciar Experiencia AR
                <i>→</i>
            </a>
        </main>
    </div>
</body>
</html>
